name: SonarCloud PR Analysis

on:
  push:
    branches: [ main , development ]
  pull_request:

jobs:
  sonarcloud:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history required for PR analysis

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.2'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Generate frontend test coverage
        working-directory: ./frontend
        run: npm run test:coverage

      - name: Generate Go test coverage
        working-directory: ./backend
        run: |
          go test ./... -coverprofile=coverage.out -covermode=atomic

      - name: SonarCloud Scan
        uses: sonarsource/sonarcloud-github-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # required for PR decoration
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=the-sprintables_campus-event-planner
            -Dsonar.organization=the-sprintables
            -Dsonar.coverage.exclusions=frontend/src/main.tsx,frontend/src/**/types.ts,frontend/vite.config.ts,frontend/**/vite-env.d.ts,frontend/src/**/*.test.{ts,tsx},frontend/src/**/*.spec.{ts,tsx},frontend/src/test/**
